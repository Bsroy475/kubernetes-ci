pipeline:
  id: pipeline_kubernetes_ci_build_2caa
  name: pipeline_kubernetes_ci_build_2caa
  stages:
    - name: Build and Test
      id: build_and_test
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - name: Setup Go
          id: setup_go
          run:
            shell: bash
            script: |-
              mkdir -p /harness/.tools
              GO_VERSION=1.27.2
              curl -sSfL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | tar -C /harness/.tools -xz
              /harness/.tools/go/bin/go version
        - name: Test
          id: test
          run:
            shell: bash
            script: |-
              export PATH=/harness/.tools/go/bin:$PATH
              export GOPATH=/harness/.cache/go
              export GOMODCACHE=/harness/.cache/go/pkg/mod
              export GOCACHE=/harness/.cache/go-build
              export PATH="${GOPATH}/bin:${PATH}"
              go version
              if ! command -v jq >/dev/null 2>&1; then
                sudo apt-get install -y -q jq 2>/dev/null || sudo yum install -y jq 2>/dev/null || true
              fi
              mkdir -p .harness/reports .harness/coverage
              KUBE_JUNIT_REPORT_DIR=.harness/reports \
              KUBE_COVER=y \
              KUBE_COVER_REPORT_DIR=.harness/coverage \
              make test
            report:
              type: junit
              paths:
                - .harness/reports/*.xml
        - name: Upload Coverage
          id: upload_coverage
          run:
            shell: bash
            script: |-
              test -s ".harness/coverage/combined-coverage.out"
              hcli cov upload --file=".harness/coverage/combined-coverage.out"
  tags:
    onboarding: "true"
