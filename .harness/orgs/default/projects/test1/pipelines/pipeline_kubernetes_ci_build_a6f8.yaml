pipeline:
  id: pipeline_kubernetes_ci_build_a6f8
  name: pipeline_kubernetes_ci_build_a6f8
  stages:
    - name: Build and Test
      id: build_and_test
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - name: Setup Go
          id: setup_go
          template:
            uses: setupGo@1.0.1
            with:
              version: 1.27.2
        - name: Build
          id: build
          run:
            shell: bash
            script: |-
              export GOPATH=/harness/.cache/go
              export GOMODCACHE=/harness/.cache/go/pkg/mod
              export GOCACHE=/harness/.cache/go-build
              go version
              make all
        - name: Test
          id: test
          run:
            shell: bash
            env:
              CI: "true"
              KUBE_JUNIT_REPORT_DIR: /harness/reports
              KUBE_COVER: y
              KUBE_COVER_REPORT_DIR: /harness/coverage
              GOPATH: /harness/.cache/go
              GOMODCACHE: /harness/.cache/go/pkg/mod
              GOCACHE: /harness/.cache/go-build
            script: |-
              mkdir -p /harness/reports /harness/coverage
              go version
              make test
            report:
              type: junit
              paths:
                - /harness/reports/junit_*.xml
        - name: Upload Coverage
          id: upload_coverage
          run:
            shell: bash
            script: |-
              test -s "/harness/coverage/combined-coverage.out"
              hcli cov upload --file="/harness/coverage/combined-coverage.out"
  tags:
    onboarding: "true"
