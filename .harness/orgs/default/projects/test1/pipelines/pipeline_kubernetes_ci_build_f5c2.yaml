pipeline:
  id: pipeline_kubernetes_ci_build_f5c2
  name: pipeline_kubernetes_ci_build_f5c2
  stages:
    - name: Build and Test
      id: build_and_test
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - name: Setup Go and Tools
          id: setup_go_and_tools
          run:
            shell: bash
            script: |-
              sudo rm -rf /usr/local/go
              curl -fsSL "https://dl.google.com/go/go1.27.2.linux-amd64.tar.gz" -o /tmp/go.tar.gz
              sudo tar -C /usr/local -xzf /tmp/go.tar.gz
              export PATH="/usr/local/go/bin:${PATH}"
              go version
              sudo apt-get update -qq
              sudo apt-get install -y -qq jq
        - name: Build
          id: build
          run:
            shell: bash
            script: |-
              export PATH="/usr/local/go/bin:${PATH}"
              go version
              make all
        - name: Test
          id: test
          run:
            shell: bash
            script: |-
              export PATH="/usr/local/go/bin:${PATH}"
              export CI=true
              go version
              mkdir -p .harness/reports .harness/coverage
              KUBE_JUNIT_REPORT_DIR="$(pwd)/.harness/reports" \
              KUBE_COVER=y \
              KUBE_COVER_REPORT_DIR="$(pwd)/.harness/coverage" \
              KUBE_RACE="" \
              hack/make-rules/test.sh
            report:
              type: junit
              paths:
                - .harness/reports/junit_*.xml
        - name: Upload Coverage
          id: upload_coverage
          run:
            shell: bash
            script: |-
              test -s ".harness/coverage/combined-coverage.out"
              hcli cov upload --file=".harness/coverage/combined-coverage.out"
  tags:
    onboarding: "true"
