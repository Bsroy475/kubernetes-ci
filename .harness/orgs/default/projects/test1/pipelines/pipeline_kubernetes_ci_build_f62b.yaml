pipeline:
  id: pipeline_kubernetes_ci_build_f62b
  name: pipeline_kubernetes_ci_build_f62b
  stages:
    - name: Build and Test
      id: build_and_test
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - name: Setup Go
          id: setup_go
          run:
            shell: bash
            script: |-
              GO_VERSION="1.27.2"
              curl -sSfL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tar.gz
              sudo rm -rf /usr/local/go
              sudo tar -C /usr/local -xzf /tmp/go.tar.gz
              /usr/local/go/bin/go version
        - name: Test
          id: test
          run:
            shell: bash
            script: |-
              export PATH=/usr/local/go/bin:$PATH
              go version

              # Install jq (required by hack/make-rules/test.sh via kube::util::require-jq)
              if ! command -v jq >/dev/null 2>&1; then
                sudo apt-get update -qq && sudo apt-get install -y jq
              fi
              jq --version

              # Prepare output directories
              mkdir -p .harness/reports .harness/coverage

              # Run unit tests; test.sh installs gotestsum and prune-junit-xml from repo
              # KUBE_JUNIT_REPORT_DIR enables JUnit XML output
              # KUBE_COVER=y + KUBE_COVER_REPORT_DIR enables coverage output (combined-coverage.out)
              KUBE_JUNIT_REPORT_DIR=".harness/reports" \
              KUBE_COVER=y \
              KUBE_COVER_REPORT_DIR=".harness/coverage" \
              make test
            report:
              type: junit
              paths:
                - .harness/reports/junit_*.xml
        - name: Upload Coverage
          id: upload_coverage
          run:
            shell: bash
            script: |-
              test -s ".harness/coverage/combined-coverage.out"
              hcli cov upload --file=".harness/coverage/combined-coverage.out"
  tags:
    onboarding: "true"
