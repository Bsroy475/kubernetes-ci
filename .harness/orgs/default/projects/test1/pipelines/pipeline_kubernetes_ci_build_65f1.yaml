pipeline:
  id: pipeline_kubernetes_ci_build_65f1
  name: pipeline_kubernetes_ci_build_65f1
  stages:
    - name: Build and Test
      id: build_and_test
      clone:
        enabled: true
      cache:
        enabled: true
      platform:
        os: linux
        arch: amd64
      runtime: cloud
      steps:
        - name: Install Go
          id: install_go
          run:
            shell: bash
            script: |-
              set -euo pipefail
              mkdir -p /harness/tools
              curl -fsSL "https://go.dev/dl/go1.27.2.linux-amd64.tar.gz" | tar -C /harness/tools -xzf -
              /harness/tools/go/bin/go version
        - name: Run Unit Tests
          id: run_unit_tests
          run:
            shell: bash
            script: |-
              set -euo pipefail
              export PATH=/harness/tools/go/bin:$PATH
              export GOTOOLCHAIN=local
              export KUBE_GOPATH=/harness/.cache/go
              go version
              mkdir -p .harness/reports .harness/coverage
              KUBE_JUNIT_REPORT_DIR="$(pwd)/.harness/reports" \
              KUBE_COVER=y \
              KUBE_COVER_REPORT_DIR="$(pwd)/.harness/coverage" \
              make test
            report:
              type: junit
              paths:
                - .harness/reports/*.xml
        - name: Upload Coverage
          id: upload_coverage
          run:
            shell: bash
            script: |-
              test -s ".harness/coverage/combined-coverage.out"
              hcli cov upload --file=".harness/coverage/combined-coverage.out"
  tags:
    onboarding: "true"
