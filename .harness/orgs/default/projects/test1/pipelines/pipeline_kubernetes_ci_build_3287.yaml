pipeline:
  id: pipeline_kubernetes_ci_build_3287
  name: pipeline_kubernetes_ci_build_3287
  stages:
    - name: Build and Test
      id: build_and_test
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - name: Setup Go and System Tools
          id: setup_go_and_system_tools
          run:
            shell: bash
            script: |-
              GO_VERSION="1.27.2"
              sudo rm -rf /usr/local/go
              curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | sudo tar -C /usr/local -xz
              export PATH="/usr/local/go/bin:${PATH}"
              go version
              sudo apt-get update -qq
              sudo apt-get install -y -qq jq make
        - name: Build
          id: build
          run:
            shell: bash
            script: |-
              export PATH="/usr/local/go/bin:${PATH}"
              export GOPATH=/harness/.cache/go
              export GOMODCACHE=/harness/.cache/go/pkg/mod
              export GOCACHE=/harness/.cache/go-build
              go version
              make all
        - name: Test
          id: test
          run:
            shell: bash
            script: |-
              export CI=true
              export PATH="/usr/local/go/bin:${PATH}"
              export GOPATH=/harness/.cache/go
              export GOMODCACHE=/harness/.cache/go/pkg/mod
              export GOCACHE=/harness/.cache/go-build
              mkdir -p /harness/reports /harness/coverage
              KUBE_JUNIT_REPORT_DIR=/harness/reports \
                KUBE_COVER=y \
                KUBE_COVER_REPORT_DIR=/harness/coverage \
                make test
            report:
              type: junit
              paths:
                - /harness/reports/*.xml
        - name: Upload Coverage
          id: upload_coverage
          run:
            shell: bash
            script: |-
              test -s "/harness/coverage/combined-coverage.out"
              hcli cov upload --file="/harness/coverage/combined-coverage.out"
  tags:
    onboarding: "true"
