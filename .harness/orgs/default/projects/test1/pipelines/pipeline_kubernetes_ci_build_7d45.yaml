pipeline:
  id: pipeline_kubernetes_ci_build_7d45
  name: pipeline_kubernetes_ci_build_7d45
  stages:
    - name: Build and Test
      id: build_and_test
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - name: Setup Go
          id: setup_go
          run:
            shell: bash
            script: |-
              sudo rm -rf /usr/local/go
              curl -fsSL "https://dl.google.com/go/go1.27.2.linux-amd64.tar.gz" -o /tmp/go.tar.gz
              sudo tar -C /usr/local -xzf /tmp/go.tar.gz
              export PATH="/usr/local/go/bin:${PATH}"
              go version
        - name: Build
          id: build
          run:
            shell: bash
            script: |-
              export PATH="/usr/local/go/bin:${PATH}"
              export GOPATH=/harness/.cache/go
              export GOMODCACHE=/harness/.cache/go/pkg/mod
              export GOCACHE=/harness/.cache/go-build
              go version
              make all
        - name: Test
          id: test
          run:
            shell: bash
            script: |-
              export CI=true
              export PATH="/usr/local/go/bin:${PATH}"
              export GOPATH=/harness/.cache/go
              export GOMODCACHE=/harness/.cache/go/pkg/mod
              export GOCACHE=/harness/.cache/go-build
              go install github.com/jstemmer/go-junit-report/v2@v2.1.0
              mkdir -p .harness/reports .harness/coverage
              set +e
              make test 2>&1 | tee .harness/reports/go-test.log
              test_status=${PIPESTATUS[0]}
              "${GOPATH}/bin/go-junit-report" -set-exit-code < .harness/reports/go-test.log > .harness/reports/junit.xml
              report_status=$?
              set -e
              if [ "${test_status}" -ne 0 ]; then exit "${test_status}"; fi
              exit "${report_status}"
            report:
              type: junit
              paths:
                - .harness/reports/junit.xml
  tags:
    onboarding: "true"
