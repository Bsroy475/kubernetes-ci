pipeline:
  id: pipeline_kubernetes_ci_build_f48b
  name: pipeline_kubernetes_ci_build_f48b
  stages:
    - name: Build and Test
      id: build_and_test
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - name: Install Go
          id: install_go
          run:
            shell: bash
            script: |-
              GO_VERSION="1.27.2"
              sudo rm -rf /usr/local/go
              curl -fsSL "https://dl.google.com/go/go${GO_VERSION}.linux-amd64.tar.gz" | sudo tar -C /usr/local -xz
              export PATH="/usr/local/go/bin:${PATH}"
              go version
        - name: Build
          id: build
          run:
            shell: bash
            script: |-
              export PATH="/usr/local/go/bin:${PATH}"
              export GOPATH="/harness/.cache/go"
              export GOMODCACHE="/harness/.cache/go/pkg/mod"
              export GOCACHE="/harness/.cache/go-build"
              go version
              make all
        - name: Test
          id: test
          run:
            shell: bash
            script: |-
              export PATH="/usr/local/go/bin:${PATH}"
              export GOPATH="/harness/.cache/go"
              export GOMODCACHE="/harness/.cache/go/pkg/mod"
              export GOCACHE="/harness/.cache/go-build"
              export CI=true
              export KUBE_JUNIT_REPORT_DIR="/harness/reports"
              export KUBE_COVER="y"
              export KUBE_COVER_REPORT_DIR="/harness/coverage"
              mkdir -p /harness/reports /harness/coverage
              go version
              make test
            report:
              type: junit
              paths:
                - /harness/reports/*.xml
        - name: Upload Coverage
          id: upload_coverage
          run:
            shell: bash
            script: |-
              test -s "/harness/coverage/combined-coverage.out"
              hcli cov upload --file="/harness/coverage/combined-coverage.out"
  tags:
    onboarding: "true"
