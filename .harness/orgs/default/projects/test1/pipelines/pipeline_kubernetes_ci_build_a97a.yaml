pipeline:
  id: pipeline_kubernetes_ci_build_a97a
  name: pipeline_kubernetes_ci_build_a97a
  stages:
    - name: Build and Test
      id: build_and_test
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - name: Setup Go Toolchain
          id: setup_go
          run:
            shell: bash
            script: |-
              set -euo pipefail
              GO_VERSION="1.27.2"
              echo "Installing Go ${GO_VERSION}"
              sudo apt-get update -qq
              sudo apt-get install -y -qq jq rsync build-essential
              curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tar.gz
              sudo rm -rf /usr/local/go
              sudo tar -C /usr/local -xzf /tmp/go.tar.gz
              export PATH="/usr/local/go/bin:${PATH}"
              go version
        - name: Build
          id: build
          run:
            shell: bash
            script: |-
              set -euo pipefail
              export PATH="/usr/local/go/bin:${PATH}"
              export GOPATH=/harness/.cache/go
              export GOMODCACHE=/harness/.cache/go/pkg/mod
              export GOCACHE=/harness/.cache/go-build
              go version
              make
        - name: Test
          id: test
          run:
            shell: bash
            script: |-
              set -euo pipefail
              export PATH="/usr/local/go/bin:${PATH}"
              export GOPATH=/harness/.cache/go
              export GOMODCACHE=/harness/.cache/go/pkg/mod
              export GOCACHE=/harness/.cache/go-build
              export CI=true
              mkdir -p "$(pwd)/.harness/reports" "$(pwd)/.harness/coverage"
              export KUBE_JUNIT_REPORT_DIR="$(pwd)/.harness/reports"
              export KUBE_COVER=y
              export KUBE_COVER_REPORT_DIR="$(pwd)/.harness/coverage"
              go version
              make test
            report:
              type: junit
              paths:
                - .harness/reports/junit_*.xml
        - name: Upload Coverage
          id: upload_coverage
          run:
            shell: bash
            script: |-
              set -euo pipefail
              test -s ".harness/coverage/combined-coverage.out"
              hcli cov upload --file=".harness/coverage/combined-coverage.out"
  tags:
    onboarding: "true"
