pipeline:
  id: pipeline_kubernetes_ci_build_fe1c
  name: pipeline_kubernetes_ci_build_fe1c
  stages:
    - name: Build and Test
      id: build_and_test
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - name: Setup Go and Tools
          id: setup_go_and_tools
          run:
            shell: bash
            script: |-
              set -euo pipefail
              # Install jq (required by hack/make-rules/test.sh)
              sudo apt-get update -qq && sudo apt-get install -y -qq jq

              # Install Go 1.27.2 as required by .go-version
              GO_VERSION=1.27.2
              curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tar.gz
              sudo rm -rf /usr/local/go
              sudo tar -C /usr/local -xzf /tmp/go.tar.gz
              echo "PATH=/usr/local/go/bin:$PATH" >> "$HARNESS_ENV"
              echo "GOPATH=/harness/.cache/go" >> "$HARNESS_ENV"
              echo "GOMODCACHE=/harness/.cache/go/pkg/mod" >> "$HARNESS_ENV"
              echo "GOCACHE=/harness/.cache/go-build" >> "$HARNESS_ENV"
              /usr/local/go/bin/go version
        - name: Test
          id: test
          run:
            shell: bash
            script: |-
              set -euo pipefail
              export PATH=/usr/local/go/bin:$PATH
              export GOPATH=/harness/.cache/go
              export GOMODCACHE=/harness/.cache/go/pkg/mod
              export GOCACHE=/harness/.cache/go-build

              go version

              mkdir -p .harness/reports .harness/coverage

              # Run unit tests with JUnit XML and coverage output
              # gotestsum is installed from hack/tools if not found
              # prune-junit-xml is installed from cmd/prune-junit-xml if not found
              KUBE_JUNIT_REPORT_DIR=.harness/reports \
              KUBE_COVER=y \
              KUBE_COVER_REPORT_DIR=.harness/coverage \
              KUBE_RACE="" \
                make test
            report:
              type: junit
              paths:
                - .harness/reports/*.xml
        - name: Upload Coverage
          id: upload_coverage
          run:
            shell: bash
            script: |-
              test -s ".harness/coverage/combined-coverage.out"
              hcli cov upload --file=".harness/coverage/combined-coverage.out"
  tags:
    onboarding: "true"
