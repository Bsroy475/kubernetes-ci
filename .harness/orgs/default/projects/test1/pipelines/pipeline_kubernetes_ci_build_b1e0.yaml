pipeline:
  id: pipeline_kubernetes_ci_build_b1e0
  name: pipeline_kubernetes_ci_build_b1e0
  stages:
    - name: Build and Test
      id: build_and_test
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - name: Setup Go
          id: setup_go
          template:
            uses: setupGo@1.0.1
            with:
              version: auto
        - name: Install System Dependencies
          id: install_system_deps
          run:
            shell: bash
            script: |-
              sudo apt-get update -qq
              sudo apt-get install -y -qq jq rsync
        - name: Build
          id: build
          run:
            shell: bash
            script: |-
              export GOPATH=/harness/.cache/go
              export GOMODCACHE=/harness/.cache/go/pkg/mod
              export GOCACHE=/harness/.cache/go-build
              export PATH="${GOPATH}/bin:${PATH}"
              go version
              make all
        - name: Test
          id: test
          run:
            shell: bash
            script: |-
              export GOPATH=/harness/.cache/go
              export GOMODCACHE=/harness/.cache/go/pkg/mod
              export GOCACHE=/harness/.cache/go-build
              export PATH="${GOPATH}/bin:${PATH}"
              mkdir -p .harness/reports .harness/coverage
              KUBE_JUNIT_REPORT_DIR="$(pwd)/.harness/reports" \
              KUBE_COVER=y \
              KUBE_COVER_REPORT_DIR="$(pwd)/.harness/coverage" \
              CI=true \
              make test
            env:
              CI: "true"
            report:
              type: junit
              paths:
                - .harness/reports/*.xml
        - name: Upload Coverage
          id: upload_coverage
          run:
            shell: bash
            script: |-
              test -s ".harness/coverage/combined-coverage.out"
              hcli cov upload --file=".harness/coverage/combined-coverage.out"
  tags:
    onboarding: "true"
